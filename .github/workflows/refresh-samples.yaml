name: Refresh Samples Workflow
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'
  push:
    branches:
      - main
    paths:
      - 'scripts/**.ts'
      - 'mappers/**.ts'
      - 'lib/**.ts'
      - 'templates/**'

concurrency:
  group: refresh-samples-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run_script:
    name: Refresh the JSON samples, their exports and the PDF statements
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Short-lived token of the samples bot GitHub App, a bypass actor of the
      # main branch ruleset, so the refreshed samples can be pushed to main.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.SAMPLES_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SAMPLES_BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm start
      - run: npm run convert
      - run: npm run linxo-test-bank
      - uses: EndBug/add-and-commit@v11
        with:
          add: '["*.json", "raw-data/linxo_test_bank/**/*.txt"]'
          push: true
          message: 'chore: 🤖 Automatically refreshed data samples'
          author_name: Algoan Bot
          author_email: bot@algoan.com
      - run: npm run statements
      - name: Publish the statements on the statements-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view statements-latest > /dev/null 2>&1 || gh release create statements-latest \
            --title 'Bank statements (latest)' \
            --notes 'Monthly PDF bank statements of every Personae, rebuilt from the samples on every run.' \
            --latest=false
          gh release upload statements-latest statements/*.pdf --clobber
          assets=$(gh release view statements-latest --json assets --jq '.assets[].name')
          for asset in $assets; do
            [ -f "statements/$asset" ] || gh release delete-asset statements-latest "$asset" --yes
          done
