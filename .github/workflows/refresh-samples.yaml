name: Refresh Samples Workflow
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'
  push:
    branches:
      - main
    paths:
      - 'scripts/**.ts'
      - 'mappers/**.ts'
      - 'lib/**.ts'
      - 'templates/**'

# Two runs committing to main at the same time would race each other: let a run
# finish before the next one starts, rather than cancelling it half way through.
concurrency:
  group: refresh-samples
  cancel-in-progress: false

jobs:
  run_script:
    name: Refresh the JSON samples, their exports and the PDF statements
    runs-on: ubuntu-latest
    env:
      # `npm start` normalises every date to noon in the *local* zone. Pinning the
      # job to UTC keeps the committed samples on T12:00:00.000Z.
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_GHA_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # `npm ci` rather than `npm i`: it installs exactly what the lockfile pins
      # and never rewrites it mid-run.
      - run: npm ci
      - run: npm start
      - run: npm run convert
      - run: npm run linxo-test-bank
      - run: npm run statements
      - uses: EndBug/add-and-commit@v9
        with:
          # `git add` on these patterns also stages the statements the script
          # pruned, so months that fall out of the samples leave the repository.
          add: '["*.json", "raw-data/linxo_test_bank/**/*.txt", "statements/**/*.pdf"]'
          push: true
          message: 'chore: 🤖 Automatically refreshed data samples'
          author_name: Algoan Bot
          author_email: bot@algoan.com
