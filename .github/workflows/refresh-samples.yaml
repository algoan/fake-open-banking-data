name: Refresh Samples Workflow
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'
  push:
    branches:
      - main
    paths:
      - 'scripts/**.ts'
      - 'mappers/**.ts'
      - 'lib/**.ts'
      - 'templates/**'

concurrency:
  group: refresh-samples
  cancel-in-progress: false

jobs:
  run_script:
    name: Refresh the JSON samples, their exports and the PDF statements
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_GHA_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm start
      - run: npm run convert
      - run: npm run linxo-test-bank
      - run: npm run statements
      - uses: EndBug/add-and-commit@v9
        with:
          add: '["*.json", "raw-data/linxo_test_bank/**/*.txt", "statements/**/*.pdf"]'
          push: true
          message: 'chore: 🤖 Automatically refreshed data samples'
          author_name: Algoan Bot
          author_email: bot@algoan.com
